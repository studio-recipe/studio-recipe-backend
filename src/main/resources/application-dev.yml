spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: redis
      port: 6379
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  web:
    pageable:
      default-page-size: 10

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_IN_SECONDS}

server:
  port: 8080
  servlet:
    context-path: /studio-recipe

front:
  url: ${FRONT_URL}

recommender:
  flask-base-url: ${FLASK_BASE_URL:http://flask:5000}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: studio-recipe
      namespace: docker-compose

logging:
  level:
    org.hibernate.SQL: debug
#    org.springframework.security: DEBUG
    org.hibernate.orm.jdbc.bind: trace
#    org.hibernate.stat: debug
    com.recipe: debug
